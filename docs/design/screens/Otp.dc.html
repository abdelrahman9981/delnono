<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كود التحقق</title>
<link rel="stylesheet" href="../tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#237db8}a:hover{color:#16324b}
</style>
</helmet>
<div class="phone">
<div class="screen no-nav">
  <div class="back">
    <a class="btn btn-ghost icon-btn" href="Phone.dc.html" aria-label="رجوع">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <h1>كود التحقق</h1>
  </div>

  <div class="steps" aria-label="الخطوة ١ من ٤">
    <span class="active">١</span><i></i><span>٢</span><i></i><span>٣</span><i></i><span>٤</span>
  </div>

  <span class="round-icon pink" style="width: 56px; height: 56px; border-radius: 18px; margin-bottom: 14px">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"></path><path d="m4 7 8 6 8-6"></path></svg>
  </span>
  <h2 style="font-size: 22px; margin-bottom: 6px">اكتبي الكود</h2>
  <p class="muted" style="font-size: 14px; line-height: 1.7; margin-bottom: 20px">بعتنا كود من ٦ أرقام على <b style="color: var(--text); direction: ltr; unicode-bidi: embed">+20 10 1234 5678</b> · <a href="Phone.dc.html">غيّري الرقم</a></p>

  <div class="otp" role="group" aria-label="كود التحقق">
    <input class="filled" aria-label="الرقم ١" value="٤" inputmode="numeric" maxlength="1">
    <input class="filled" aria-label="الرقم ٢" value="٨" inputmode="numeric" maxlength="1">
    <input class="filled" aria-label="الرقم ٣" value="٢" inputmode="numeric" maxlength="1">
    <input class="filled" aria-label="الرقم ٤" value="٩" inputmode="numeric" maxlength="1">
    <input aria-label="الرقم ٥" value="" inputmode="numeric" maxlength="1">
    <input aria-label="الرقم ٦" value="" inputmode="numeric" maxlength="1">
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 16px">
    <span class="muted">الكود صالح ٥ دقايق</span>
    <span class="muted">إعادة الإرسال بعد <b style="color: var(--text)">٠:٤٢</b></span>
  </div>

  <div class="notice warn">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    <p>الكود مش صح. فاضلك ٤ محاولات، وبعدها اطلبي كود جديد.</p>
  </div>

  <div style="margin-top: auto; display: grid; gap: 6px">
    <a class="btn btn-primary btn-block" href="Guardian.dc.html">تأكيد</a>
    <button class="link-btn" type="button" disabled style="opacity: .5">ابعتي الكود تاني</button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
