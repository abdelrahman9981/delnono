<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إضافة طفل</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="nono.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#237db8}a:hover{color:#16324b}
</style>
</helmet>
<div class="phone">
<div class="screen no-nav">
  <div class="back">
    <a class="btn btn-ghost icon-btn" href="LinkChildren.dc.html" aria-label="رجوع">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <h1>إضافة طفل</h1>
  </div>

  <div class="steps" aria-label="الخطوة ٤ من ٤">
    <span class="done">✓</span><i class="done"></i><span class="done">✓</span><i class="done"></i><span class="done">✓</span><i class="done"></i><span class="active">٤</span>
  </div>

  <div class="field">
    <label for="cname">اسم الطفل</label>
    <input class="input" id="cname" type="text" value="مريم">
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div class="field">
      <label for="dob">تاريخ الميلاد</label>
      <input class="input" id="dob" type="text" value="٤ مارس ٢٠٢٣">
    </div>
    <div class="field">
      <label id="sex-label">النوع</label>
      <div class="segmented two" role="group" aria-labelledby="sex-label" style="padding: 4px">
        <button type="button">ولد</button>
        <button type="button" class="active">بنت</button>
      </div>
    </div>
  </div>
  <p class="muted" style="font-size: 11px; line-height: 1.6; margin: -6px 2px 14px">تاريخ الميلاد والنوع بيحددوا جدول التطعيمات، فتعديلهم بعد كده بيبقى من العيادة.</p>

  <div class="field">
    <label for="bw">وزن الولادة <span class="muted" style="font-weight: 400">(اختياري)</span></label>
    <div style="position: relative">
      <input class="input" id="bw" type="text" inputmode="decimal" value="٣٫٢">
      <span class="muted" style="position: absolute; left: 14px; top: 16px; font-size: 13px">كجم</span>
    </div>
  </div>

  <div class="field">
    <label for="allergy">الحساسية <span class="muted" style="font-weight: 400">(اختياري)</span></label>
    <input class="input" id="allergy" type="text" placeholder="مثلًا: حساسية من البيض">
  </div>

  <div class="notice warn">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    <p>فيه طفل اسمه «مريم» بنفس تاريخ الميلاد مسجل على رقمك بالفعل، فمش هنضيفه تاني. لو ده غلط كلمي العيادة.</p>
  </div>

  <div style="margin-top: auto; display: grid; gap: 4px">
    <a class="btn btn-primary btn-block" href="FollowUp.dc.html">حفظ</a>
    <a class="link-btn" href="FollowUp.dc.html" style="text-align: center; text-decoration: none">هضيف أطفال تانيين بعدين</a>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
